# Practical 11: Containerization with Docker and Docker Compose
# Student: Om Italiya (24IT029) - CSPIT CHARUSAT
# Course: Advanced Web Development Frameworks (AWDF)

version: '3.8'

services:
  # Service 1: React Frontend (Multi-stage build served on port 5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awdf-frontend-24it029
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Service 2: Node.js / Express Backend (Runs on port 5000, connects to mongodb service)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awdf-backend-24it029
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/taskdb
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # Service 3: MongoDB Database (Official Mongo 6.0 Image with persistent named volume)
  mongodb:
    image: mongo:6.0
    container_name: awdf-mongodb-24it029
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped

# Named Volume for Database Persistence across container restarts
volumes:
  mongo-data:
    name: awdf-mongo-data-24it029

# Inter-container Bridge Network allowing frontend -> backend -> mongodb DNS resolution
networks:
  app-network:
    name: awdf-app-network-24it029
    driver: bridge
